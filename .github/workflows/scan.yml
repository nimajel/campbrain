name: Proactive Scan
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (GitHub cron is best-effort, UTC).
                            # Repo is public → unlimited Actions minutes. CA pass on Neon ~35-55
                            # min; Rec.gov pass (hundreds of parks, polite 1.5s sequential cadence)
                            # ~95-155 min; plus digest/alert/calendar phases. timeout-minutes below
                            # is sized for the combined worst case (concurrency group above already
                            # prevents overlapping runs, so a long run just delays the next tick).
  workflow_dispatch: {}       # manual trigger for validation
concurrency:
  group: proactive-scan
  cancel-in-progress: false   # never run two scans at once
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1" }
      - run: bun install --frozen-lockfile
      - name: Apply pending DB migrations
        # Idempotent (Drizzle skips already-applied migrations). Keeps the Neon schema in
        # lockstep with the code the cron runs, so a forgotten manual migrate can't crash the
        # scan the way the missing scan_runs/hits tables did.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun --filter @campbrain/db migrate
      - name: Seed catalog (idempotent)
        # ON CONFLICT upserts — keeps providers/parks (CA + Rec.gov) present on Neon without
        # a manual seed step; new catalog JSON committed to the repo lands on the next scan.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun --filter @campbrain/db seed:catalog
      - name: Run proactive scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCAN_DEBUG_DIR: ${{ github.workspace }}/.scan-debug
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: bun --filter @campbrain/scanner start
      - name: Upload parser debug snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-debug-${{ github.run_id }}
          path: .scan-debug/
          if-no-files-found: ignore
          retention-days: 7
